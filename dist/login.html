<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Entrar</title>
    <style>
      :root {
        color: #171717;
        background: #eeeeec;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      main { width: min(100%, 390px); }

      h1 {
        margin: 0 0 8px;
        font-size: 2.25rem;
        letter-spacing: -0.05em;
      }

      .intro {
        margin: 0 0 28px;
        color: #737373;
      }

      form {
        display: grid;
        gap: 12px;
        border: 1px solid #dededb;
        border-radius: 28px;
        padding: 26px;
        background: #f8f8f6;
      }

      label { font-size: 0.88rem; font-weight: 600; }

      input,
      button {
        width: 100%;
        min-height: 50px;
        border-radius: 14px;
        font: inherit;
      }

      input {
        border: 1px solid #cececa;
        padding: 0 15px;
        color: #171717;
        background: #fff;
        outline: none;
      }

      input:focus {
        border-color: #171717;
        box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.1);
      }

      button {
        margin-top: 4px;
        border: 0;
        color: #fff;
        background: #1d1d1d;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover { background: #000; }

      .error {
        min-height: 20px;
        margin: 2px 0 0;
        color: #b42318;
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mis sitios</h1>
      <p class="intro">Ingresa para continuar.</p>

      <form action="/login" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required />
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
        <p class="error" role="alert">{{ERROR}}</p>
      </form>
    </main>
  </body>
</html>
